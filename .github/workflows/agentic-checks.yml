# Generated by agentic_init from the commands in CLAUDE.md.
# The agent runs these locally; CI re-runs them as independent evidence.
name: agentic checks
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Install
      run: uv sync
    - name: Lint
      run: uv run ruff check .
    - name: Test
      run: uv run pytest
