    ".claude/settings.json": {
      "strategy": "json",
      "owned": {
        "$schema": "https://json.schemastore.org/claude-code-settings.json",
        "permissions": {
          "allow": [
            "Bash(git status)",
            "Bash(git status *)",
            "Bash(git diff)",
            "Bash(git diff *)",
            "Bash(git log)",
            "Bash(git log *)",
            "Bash(git show)",
            "Bash(git show *)",
            "Bash(git branch)",
            "Bash(git branch *)",
            "Bash(git rev-parse)",
            "Bash(git rev-parse *)",
            "Bash(uv run pytest)",
            "Bash(uv run pytest *)",
            "Bash(uv run ruff check .)",
            "Bash(uv run ruff check *)",
            "Bash(uv run ruff format .)",
            "Bash(uv run ruff format *)",
            "Bash(git add)",
            "Bash(git add *)",
            "Bash(git commit)",
            "Bash(git commit *)",
            "Bash(git switch -c)",
            "Bash(git switch -c *)",
            "Bash(git checkout -b)",
            "Bash(git checkout -b *)",
            "Bash(gh pr create)",
            "Bash(gh pr create *)",
            "Bash(gh pr view)",
            "Bash(gh pr view *)",
            "Bash(gh pr checks)",
            "Bash(gh pr checks *)"
          ],
          "ask": [
            "Bash(git reset --hard)",
            "Bash(git reset --hard *)",
            "Bash(git clean)",
            "Bash(git clean *)",
            "Bash(git rebase)",
            "Bash(git rebase *)",
            "Bash(uv sync)",
            "Bash(uv sync *)",
            "Bash(git push)",
            "Bash(git push *)",
            "Bash(gh pr merge)",
            "Bash(gh pr merge *)"
          ],
          "deny": [
            "Bash(rm -rf *)",
            "Bash(sudo *)",
            "Bash(git push --force *)",
            "Bash(git push -f *)",
            "Read(./.env)",
            "Edit(./.env)",
            "Read(./.env.*)",
            "Edit(./.env.*)",
            "Read(./**/.env)",
            "Edit(./**/.env)",
            "Read(./**/.env.*)",
            "Edit(./**/.env.*)",
            "Read(./secrets/**)",
            "Edit(./secrets/**)",
            "Read(./**/*.pem)",
            "Edit(./**/*.pem)",
            "Read(./**/*.key)",
            "Edit(./**/*.key)",
            "Read(./**/credentials.json)",
            "Edit(./**/credentials.json)"
          ],
          "defaultMode": "acceptEdits"
        },
        "hooks": {
          "PreToolUse": [
            {
              "matcher": "Bash",
              "hooks": [
                {
                  "type": "command",
                  "command": "python3 \"$CLAUDE_PROJECT_DIR/.claude/hooks/block-dangerous-commands.py\""
                }
              ]
            },
            {
              "matcher": "Read|Edit|Write|MultiEdit|Grep|Bash",
              "hooks": [
                {
                  "type": "command",
                  "command": "python3 \"$CLAUDE_PROJECT_DIR/.claude/hooks/protect-secrets.py\""
                }
              ]
            }
          ],
          "PostToolUse": [
            {
              "matcher": "Edit|Write|MultiEdit",
              "hooks": [
                {
                  "type": "command",
                  "command": "python3 \"$CLAUDE_PROJECT_DIR/.claude/hooks/post-edit-format.py\""
                }
              ]
            }
          ]
        }
      }
    },
