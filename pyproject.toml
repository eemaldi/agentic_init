[project]
name = "agent-init"
version = "0.1.0"
description = "Bootstrap any repository with a lean, best-practice agentic development setup for Claude Code."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Enrico Emaldi", email = "enrico.emaldi@pm.me" }]
keywords = ["claude-code", "agents", "ai", "scaffolding", "mcp", "skills"]
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.scripts]
agentinit = "agentinit.cli:app"
agent-init = "agentinit.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentinit"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/agentinit/catalog", ".claude/hooks"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
